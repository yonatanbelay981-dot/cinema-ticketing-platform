services:
  seat-db:
    image: postgres:16
    container_name: seat-db
    environment:
      POSTGRES_DB: seat_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - seat_db_data:/var/lib/postgresql/data
  Redis:
    image: redis:latest
    container_name: seat-redis
    ports:
      - "6310:6379"
    volumes:
      - redis_data:/data

volumes:
    seat_db_data:
    redis_data: