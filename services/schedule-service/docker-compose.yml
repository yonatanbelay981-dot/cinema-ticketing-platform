
services:
    schedule-db:
      image: postgres:16
      container_name: schedule-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: schedule_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      ports:
        - "5437:5432"
      volumes:
        - schedule_postgres_data:/var/lib/postgresql/data

volumes:
    schedule_postgres_data: